<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0f172a"/>
  <rect width="600" height="400" fill="url(#grad2)" opacity="0.1"/>
  
  <!-- Kubernetes nodes -->
  <g opacity="0.8">
    <rect x="80" y="80" width="80" height="80" fill="none" stroke="#06b6d4" stroke-width="2" rx="5"/>
    <text x="120" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#06b6d4">Node 1</text>
    
    <rect x="260" y="80" width="80" height="80" fill="none" stroke="#0ea5e9" stroke-width="2" rx="5"/>
    <text x="300" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#0ea5e9">Node 2</text>
    
    <rect x="440" y="80" width="80" height="80" fill="none" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="480" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#3b82f6">Node 3</text>
  </g>
  
  <!-- Pods within nodes -->
  <g fill="#06b6d4" opacity="0.3">
    <circle cx="100" cy="160" r="8"/>
    <circle cx="130" cy="160" r="8"/>
    <circle cx="110" cy="180" r="8"/>
  </g>
  
  <g fill="#0ea5e9" opacity="0.3">
    <circle cx="280" cy="160" r="8"/>
    <circle cx="310" cy="160" r="8"/>
    <circle cx="290" cy="180" r="8"/>
  </g>
  
  <g fill="#3b82f6" opacity="0.3">
    <circle cx="460" cy="160" r="8"/>
    <circle cx="490" cy="160" r="8"/>
    <circle cx="470" cy="180" r="8"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#06b6d4" stroke-width="2" opacity="0.5">
    <line x1="160" y1="120" x2="260" y2="120"/>
    <line x1="340" y1="120" x2="440" y2="120"/>
  </g>
  
  <!-- Orchestration symbol -->
  <g opacity="0.7">
    <circle cx="300" cy="280" r="50" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="300" cy="280" r="35" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="300" cy="280" r="20" fill="#06b6d4" opacity="0.5"/>
  </g>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e0e7ff">
    Kubernetes Cluster
  </text>
</svg>
