<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#logoGrad)" opacity="0.1"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#logoGrad)" stroke-width="2"/>
  <g transform="translate(100, 100)">
    <!-- Phantom symbol - stylized P -->
    <path d="M -25 -30 L -25 30 L -10 30 Q 10 30 10 10 Q 10 -10 -10 -10 L -25 -10" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Assembly symbol - gears -->
    <circle cx="25" cy="-10" r="8" fill="none" stroke="url(#logoGrad)" stroke-width="2"/>
    <circle cx="25" cy="15" r="6" fill="none" stroke="url(#logoGrad)" stroke-width="2"/>
    <line x1="25" y1="-2" x2="25" y2="9" stroke="url(#logoGrad)" stroke-width="1.5"/>
  </g>
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6366f1">
    PHANTOM ASSEMBLY
  </text>
</svg>
