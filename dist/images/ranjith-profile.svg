<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="200" height="250">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="profileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Professional background -->
  <circle cx="200" cy="150" r="120" fill="url(#profileGrad)" opacity="0.2"/>
  
  <!-- Head -->
  <circle cx="200" cy="130" r="70" fill="#9ca3af"/>
  
  <!-- Face details -->
  <circle cx="185" cy="115" r="8" fill="#1e293b"/>
  <circle cx="215" cy="115" r="8" fill="#1e293b"/>
  <path d="M 190 140 Q 200 150 210 140" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Shoulders and body -->
  <ellipse cx="200" cy="240" rx="80" ry="100" fill="#4b5563"/>
  
  <!-- Professional outfit suggestion -->
  <path d="M 120 200 L 140 240 L 260 240 L 280 200" fill="#374151"/>
  
  <!-- Accent detail -->
  <circle cx="200" cy="380" r="40" fill="url(#profileGrad)" opacity="0.3"/>
  
  <!-- Tech-themed elements -->
  <g opacity="0.5">
    <line x1="100" y1="400" x2="140" y2="410" stroke="#6366f1" stroke-width="2"/>
    <line x1="260" y1="410" x2="300" y2="400" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="70" cy="420" r="3" fill="#6366f1"/>
    <circle cx="330" cy="420" r="3" fill="#8b5cf6"/>
  </g>
</svg>
