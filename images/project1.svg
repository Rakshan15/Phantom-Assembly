<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0f172a"/>
  <rect width="600" height="400" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Circuit pattern -->
  <g stroke="#6366f1" stroke-width="1" opacity="0.3">
    <line x1="50" y1="80" x2="150" y2="80"/>
    <line x1="150" y1="80" x2="150" y2="180"/>
    <line x1="150" y1="180" x2="50" y2="180"/>
    <line x1="50" y1="180" x2="50" y2="280"/>
  </g>
  
  <!-- AWS Lambda symbols -->
  <g opacity="0.8">
    <circle cx="300" cy="100" r="30" fill="none" stroke="#ff9900" stroke-width="2"/>
    <path d="M 280 100 L 300 85 L 320 100 L 300 115 Z" fill="#ff9900"/>
  </g>
  
  <!-- DynamoDB icon -->
  <g opacity="0.8">
    <circle cx="450" cy="150" r="25" fill="none" stroke="#527fff" stroke-width="2"/>
    <circle cx="450" cy="150" r="15" fill="none" stroke="#527fff" stroke-width="1"/>
  </g>
  
  <!-- Cloud shapes -->
  <g fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.6">
    <path d="M 100 300 Q 80 280 100 260 Q 120 250 140 260 Q 160 240 180 260 Q 200 250 220 270 L 220 300 Z"/>
    <path d="M 380 320 Q 360 300 380 280 Q 400 270 420 280 Q 440 260 460 280 Q 480 270 500 290 L 500 320 Z"/>
  </g>
  
  <!-- Data flow indicators -->
  <g stroke="#6366f1" stroke-width="2" opacity="0.5">
    <line x1="200" y1="150" x2="280" y2="150"/>
    <line x1="330" y1="130" x2="410" y2="155"/>
    <polygon points="420,155 410,150 415,157" fill="#6366f1"/>
  </g>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e0e7ff">
    Serverless Architecture
  </text>
</svg>
