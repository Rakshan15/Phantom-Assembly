<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0f172a"/>
  <rect width="600" height="400" fill="url(#grad3)" opacity="0.1"/>
  
  <!-- Pipeline stages -->
  <g opacity="0.8">
    <rect x="50" y="150" width="90" height="80" fill="none" stroke="#f59e0b" stroke-width="2" rx="5"/>
    <text x="95" y="200" text-anchor="middle" font-family="Arial" font-size="11" fill="#f59e0b" font-weight="bold">Code</text>
    
    <rect x="180" y="150" width="90" height="80" fill="none" stroke="#f97316" stroke-width="2" rx="5"/>
    <text x="225" y="200" text-anchor="middle" font-family="Arial" font-size="11" fill="#f97316" font-weight="bold">Build</text>
    
    <rect x="310" y="150" width="90" height="80" fill="none" stroke="#ef4444" stroke-width="2" rx="5"/>
    <text x="355" y="200" text-anchor="middle" font-family="Arial" font-size="11" fill="#ef4444" font-weight="bold">Test</text>
    
    <rect x="440" y="150" width="90" height="80" fill="none" stroke="#dc2626" stroke-width="2" rx="5"/>
    <text x="485" y="200" text-anchor="middle" font-family="Arial" font-size="11" fill="#dc2626" font-weight="bold">Deploy</text>
  </g>
  
  <!-- Pipeline arrows -->
  <g stroke="#f59e0b" stroke-width="2" fill="#f59e0b" opacity="0.6">
    <line x1="140" y1="190" x2="170" y2="190"/>
    <polygon points="175,190 165,185 165,195" fill="#f59e0b"/>
    
    <line x1="270" y1="190" x2="300" y2="190"/>
    <polygon points="305,190 295,185 295,195" fill="#f97316"/>
    
    <line x1="400" y1="190" x2="430" y2="190"/>
    <polygon points="435,190 425,185 425,195" fill="#ef4444"/>
  </g>
  
  <!-- Status indicators -->
  <circle cx="95" cy="150" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="225" cy="150" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="355" cy="150" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="485" cy="150" r="6" fill="#22c55e" opacity="0.8"/>
  
  <!-- CI/CD symbol at center bottom -->
  <g opacity="0.5">
    <circle cx="300" cy="310" r="45" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 280 300 L 300 320 L 320 300" fill="none" stroke="#f97316" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e0e7ff">
    CI/CD Pipeline
  </text>
</svg>
