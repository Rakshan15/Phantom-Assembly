<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#0f172a"/>
  <rect width="600" height="400" fill="url(#grad4)" opacity="0.1"/>
  
  <!-- Infrastructure blocks -->
  <g opacity="0.8">
    <!-- VPC -->
    <rect x="80" y="80" width="440" height="240" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
    <text x="95" y="100" font-family="Arial" font-size="12" fill="#8b5cf6">VPC</text>
    
    <!-- Subnets -->
    <rect x="100" y="120" width="180" height="80" fill="none" stroke="#a855f7" stroke-width="2" rx="3"/>
    <text x="110" y="140" font-family="Arial" font-size="11" fill="#a855f7">Public Subnet</text>
    
    <rect x="320" y="120" width="180" height="80" fill="none" stroke="#a855f7" stroke-width="2" rx="3"/>
    <text x="330" y="140" font-family="Arial" font-size="11" fill="#a855f7">Private Subnet</text>
    
    <!-- Instances -->
    <g fill="#a855f7" opacity="0.3">
      <rect x="120" y="160" width="50" height="30" rx="2"/>
      <rect x="180" y="160" width="50" height="30" rx="2"/>
      <rect x="340" y="160" width="50" height="30" rx="2"/>
      <rect x="400" y="160" width="50" height="30" rx="2"/>
    </g>
  </g>
  
  <!-- Load Balancer -->
  <g opacity="0.8">
    <rect x="240" y="260" width="120" height="40" fill="none" stroke="#c084fc" stroke-width="2" rx="3"/>
    <text x="300" y="285" text-anchor="middle" font-family="Arial" font-size="11" fill="#c084fc" font-weight="bold">Load Balancer</text>
  </g>
  
  <!-- Terraform logo area -->
  <g opacity="0.6">
    <circle cx="550" cy="100" r="25" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <text x="550" y="110" text-anchor="middle" font-family="Arial" font-size="20" fill="#8b5cf6">⟨⟩</text>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#a855f7" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,3">
    <line x1="300" y1="200" x2="300" y2="260"/>
  </g>
  
  <!-- Title -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e0e7ff">
    Infrastructure as Code
  </text>
</svg>
